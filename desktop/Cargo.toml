[package]
name = "fokus"
version = "0.4.3"
edition = "2021"
license = "GPL-3.0-or-later"
build = "build.rs"

[build-dependencies]
tauri-build = "2"

[dependencies]
plist = "1"
fastrand = "2"
tauri = { version = "2", features = ["macos-private-api","tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
url = "2"
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication","NSImage","NSBitmapImageRep","NSGraphicsContext","NSImageRep","objc2-core-graphics","NSWindow","NSWorkspace","NSRunningApplication"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSData"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
