name: Publish Mac release
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable version tag
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: fokus-release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Select or create the release tag
        id: version
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$REQUESTED_TAG"
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            for attempt in 1 2 3; do
              git fetch origin refs/heads/main --tags
              git switch --detach --discard-changes FETCH_HEAD
              tag="v$(node -p "require('./package.json').version")"
              if [[ "$(git tag --points-at HEAD --list "$tag")" == "$tag" ]]; then
                break
              fi
              tag=$(python3 scripts/prepare-mac-release.py)
              git commit -am "Release $tag"
              # Both refs advance together. A concurrent merge causes a fresh attempt.
              if git push --atomic origin HEAD:refs/heads/main "HEAD:refs/tags/$tag"; then
                break
              fi
              if [[ "$attempt" == 3 ]]; then exit 1; fi
            done
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
  inspect:
    needs: prepare
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.check.outputs.published }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Verify an existing release or prepare to build
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          published=false
          if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null)" == false ]]; then
            mkdir "$RUNNER_TEMP/verify"
            gh release download "$RELEASE_TAG" -D "$RUNNER_TEMP/verify" -p Fokus-arm64.zip -p SHA256SUMS.txt
            if /usr/bin/python3 -c 'import plistlib; assert "SUPublicEDKey" in plistlib.load(open("desktop/Info.plist", "rb"))'; then
              gh release download "$RELEASE_TAG" -D "$RUNNER_TEMP/verify" -p appcast.xml
            fi
            (cd "$RUNNER_TEMP/verify" && sha256sum -c SHA256SUMS.txt)
            python3 scripts/check-release.py "$RUNNER_TEMP/verify/Fokus-arm64.zip"
            published=true
          fi
          echo "published=$published" >> "$GITHUB_OUTPUT"
  release:
    needs: [prepare, inspect]
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    if: needs.inspect.outputs.published != 'true'
    permissions:
      contents: write
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check tag, architecture and versions
        run: |
          test "$(uname -m)" = arm64
          version="$(node -p "require('./package.json').version")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$RELEASE_TAG" = "v$version"
          test "$version" = "$(node -p "require('./desktop/tauri.conf.json').version")"
          test "$version" = "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' desktop/Info.plist)"
          test "$version" = "$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="fokus").version')"
      - name: Verify the update advances the last published build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh release view --json tagName --jq .tagName)
          if gh release view "$latest" --json assets --jq '.assets[].name' | grep -qx appcast.xml; then
            gh release download "$latest" -D "$RUNNER_TEMP" -p appcast.xml
            python3 - "$RUNNER_TEMP/appcast.xml" <<'PY'
          import plistlib, sys, xml.etree.ElementTree as ET
          previous = ET.parse(sys.argv[1]).findtext('./channel/item/{http://www.andymatuschak.org/xml-namespaces/sparkle}version')
          with open('desktop/Info.plist','rb') as f:
              current = plistlib.load(f)['CFBundleVersion']
          if int(current) <= int(previous):
              raise SystemExit(f'Update build {current} must exceed published build {previous}')
          PY
          fi
      - run: npm ci
      - run: node --test tests/metrics.mjs && npm run build:ui && cargo test --locked --workspace
      - run: npm run build && python3 tests/helper.py
      - run: python3 scripts/check-release.py dist/Fokus-arm64.zip && node tests/puzzles.mjs && python3 tests/comet.py
      - name: Sign update archive and feed
        env:
          FOKUS_SPARKLE_KEY: ${{ secrets.FOKUS_SPARKLE_KEY }}
        run: bash scripts/make-appcast.sh "$RELEASE_TAG"
      - name: Publish verified assets together
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: dist
        run: |
          shasum -a 256 Fokus-arm64.zip appcast.xml > SHA256SUMS.txt
          shasum -a 256 -c SHA256SUMS.txt
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes
          fi
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          gh release upload "$RELEASE_TAG" Fokus-arm64.zip appcast.xml SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
